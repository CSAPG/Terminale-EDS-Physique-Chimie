<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#E24B4A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Fond blanc -->
  <rect width="1200" height="700" fill="white"/>

  <!-- Titre -->
  <text x="600" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#1a1a2e">L'effet photoélectrique</text>
  <line x1="200" y1="72" x2="1000" y2="72" stroke="#E24B4A" stroke-width="2"/>

  <!-- === SOLEIL === -->
  <circle cx="130" cy="350" r="65" fill="#FAEEDA" stroke="#EF9F27" stroke-width="3"/>
  <!-- rayons soleil -->
  <line x1="130" y1="272" x2="130" y2="255" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="130" y1="428" x2="130" y2="445" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="52" y1="350" x2="35" y2="350" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="208" y1="350" x2="195" y2="350" stroke="#EF9F27" stroke-width="2" stroke-linecap="round"/>
  <line x1="75" y1="295" x2="63" y2="283" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="185" y1="295" x2="197" y2="283" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="75" y1="405" x2="63" y2="417" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="185" y1="405" x2="197" y2="417" stroke="#EF9F27" stroke-width="2.5" stroke-linecap="round"/>
  <text x="130" y="340" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#BA7517">Source</text>
  <text x="130" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#BA7517">lumineuse</text>

  <!-- === PHOTONS (flèches oranges) === -->
  <!-- 3 flèches de photons -->
  <line x1="210" y1="290" x2="378" y2="290" stroke="#EF9F27" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="12 5"/>
  <line x1="210" y1="350" x2="378" y2="350" stroke="#EF9F27" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="12 5"/>
  <line x1="210" y1="410" x2="378" y2="410" stroke="#EF9F27" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="12 5"/>

  <!-- Labels photons -->
  <rect x="218" y="266" width="80" height="30" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="258" y="286" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#BA7517">hν</text>
  <rect x="218" y="326" width="80" height="30" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="258" y="346" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#BA7517">hν</text>
  <rect x="218" y="386" width="80" height="30" rx="6" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1.5"/>
  <text x="258" y="406" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="bold" fill="#BA7517">hν</text>

  <!-- === PLAQUE MÉTALLIQUE === -->
  <!-- Fond de la plaque -->
  <rect x="385" y="180" width="220" height="340" rx="10" fill="#D3D1C7" stroke="#888780" stroke-width="3"/>
  <!-- Texture lignes -->
  <line x1="385" y1="220" x2="605" y2="220" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="385" y1="260" x2="605" y2="260" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="385" y1="300" x2="605" y2="300" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="385" y1="340" x2="605" y2="340" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="385" y1="380" x2="605" y2="380" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="385" y1="420" x2="605" y2="420" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="385" y1="460" x2="605" y2="460" stroke="#B4B2A9" stroke-width="1"/>
  <!-- Label plaque -->
  <text x="495" y="335" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#2C2C2A">Métal</text>
  <text x="495" y="368" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#444441">(ex : zinc, Al)</text>

  <!-- Petits cercles d'électrons dans la plaque -->
  <circle cx="430" cy="225" r="10" fill="#378ADD" opacity="0.6"/>
  <text x="430" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">e⁻</text>
  <circle cx="470" cy="255" r="10" fill="#378ADD" opacity="0.6"/>
  <text x="470" y="260" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">e⁻</text>
  <circle cx="555" cy="235" r="10" fill="#378ADD" opacity="0.6"/>
  <text x="555" y="240" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">e⁻</text>
  <circle cx="440" cy="435" r="10" fill="#378ADD" opacity="0.6"/>
  <text x="440" y="440" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">e⁻</text>
  <circle cx="570" cy="455" r="10" fill="#378ADD" opacity="0.6"/>
  <text x="570" y="460" text-anchor="middle" font-family="Arial" font-size="13" fill="white" font-weight="bold">e⁻</text>

  <!-- === CONDITION ν > ν₀ === -->
  <rect x="385" y="130" width="220" height="36" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
  <text x="495" y="153" text-anchor="middle" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="#27500A">ν &gt; ν₀  →  effet PE</text>

  <!-- === ÉLECTRONS ÉJECTÉS === -->
  <!-- e1 - en haut -->
  <line x1="607" y1="240" x2="740" y2="165" stroke="#378ADD" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="770" cy="148" r="24" fill="#E6F1FB" stroke="#378ADD" stroke-width="3"/>
  <text x="770" y="142" text-anchor="middle" font-family="Arial" font-size="17" fill="#185FA5" font-weight="bold">e⁻</text>
  <text x="770" y="162" text-anchor="middle" font-family="Arial" font-size="14" fill="#378ADD">arraché</text>

  <!-- e2 - milieu -->
  <line x1="607" y1="345" x2="750" y2="345" stroke="#378ADD" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="780" cy="345" r="24" fill="#E6F1FB" stroke="#378ADD" stroke-width="3"/>
  <text x="780" y="339" text-anchor="middle" font-family="Arial" font-size="17" fill="#185FA5" font-weight="bold">e⁻</text>
  <text x="780" y="359" text-anchor="middle" font-family="Arial" font-size="14" fill="#378ADD">arraché</text>

  <!-- e3 - en bas -->
  <line x1="607" y1="450" x2="740" y2="535" stroke="#378ADD" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="770" cy="555" r="24" fill="#E6F1FB" stroke="#378ADD" stroke-width="3"/>
  <text x="770" y="549" text-anchor="middle" font-family="Arial" font-size="17" fill="#185FA5" font-weight="bold">e⁻</text>
  <text x="770" y="569" text-anchor="middle" font-family="Arial" font-size="14" fill="#378ADD">arraché</text>

  <!-- === ENCADRÉS FORMULES === -->
  <rect x="860" y="140" width="300" height="190" rx="12" fill="#F1EFE8" stroke="#888780" stroke-width="2"/>
  <text x="1010" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#2C2C2A">Formules clés</text>
  <line x1="880" y1="180" x2="1140" y2="180" stroke="#888780" stroke-width="1"/>
  <text x="880" y="210" font-family="Georgia, serif" font-size="18" fill="#2C2C2A">E</text>
  <text x="893" y="215" font-family="Georgia, serif" font-size="13" fill="#2C2C2A">photon</text>
  <text x="950" y="210" font-family="Georgia, serif" font-size="18" fill="#2C2C2A">= h · ν</text>
  <text x="880" y="245" font-family="Georgia, serif" font-size="18" fill="#2C2C2A">E</text>
  <text x="893" y="250" font-family="Georgia, serif" font-size="13" fill="#2C2C2A">c max</text>
  <text x="940" y="245" font-family="Georgia, serif" font-size="18" fill="#2C2C2A">= h·ν − W</text>
  <text x="880" y="280" font-family="Georgia, serif" font-size="18" fill="#E24B4A">Si ν &lt; ν₀ : aucun effet</text>
  <text x="880" y="308" font-family="Georgia, serif" font-size="16" fill="#444441">W = travail d'extraction</text>

  <!-- === ENCADRÉ BAS - condition === -->
  <rect x="860" y="370" width="300" height="160" rx="12" fill="#FCEBEB" stroke="#E24B4A" stroke-width="2"/>
  <text x="1010" y="400" text-anchor="middle" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#A32D2D">⚠ Point clé</text>
  <line x1="880" y1="410" x2="1140" y2="410" stroke="#E24B4A" stroke-width="1"/>
  <text x="880" y="438" font-family="Georgia, serif" font-size="16" fill="#2C2C2A">L'intensité lumineuse</text>
  <text x="880" y="462" font-family="Georgia, serif" font-size="16" fill="#2C2C2A">n'a aucun rôle.</text>
  <text x="880" y="490" font-family="Georgia, serif" font-size="16" fill="#A32D2D">Seule la fréquence ν</text>
  <text x="880" y="514" font-family="Georgia, serif" font-size="16" fill="#A32D2D">détermine l'effet PE.</text>

  <!-- Label "Électrons éjectés" -->
  <rect x="660" y="90" width="180" height="34" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
  <text x="750" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#185FA5">Électrons éjectés</text>
</svg>
